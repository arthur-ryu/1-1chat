<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마피아 게임</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body { background-color: #abc1d1; display: flex; justify-content: center; align-items: center; height: 100vh; height: 100dvh; }
        
        .container { width: 100%; max-width: 480px; height: 100%; max-height: 100vh; background-color: #efeae2; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: relative; }
        @media (min-width: 481px) {
            .container { height: 85vh; max-height: 750px; border-radius: 12px; overflow: hidden; }
        }

        .chat-header { background-color: #1f1f1f; color: #fff; padding: 12px 16px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .header-title-area { display: flex; align-items: center; gap: 8px; }
        .my-role-badge { background: #fee500; color: #3c1e1e; font-size: 11px; padding: 2px 7px; border-radius: 4px; font-weight: bold; display: none; }
        .user-tag { color: #fee500; font-size: 11px; }

        /* 대기실 뷰 (최소 4인) */
        #lobby-view { flex: 1; display: flex; flex-direction: column; padding: 30px 20px; justify-content: center; align-items: center; gap: 16px; text-align: center; }
        .player-count-card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); width: 100%; max-width: 320px; }
        .count-text { font-size: 34px; font-weight: bold; color: #3c1e1e; margin: 10px 0; }
        .timer-badge { font-size: 16px; font-weight: bold; color: #d9534f; min-height: 24px; }

        /* 게임 진행 중 난입 차단 / 관전 안내 화면 */
        #busy-view { flex: 1; display: none; flex-direction: column; padding: 30px 20px; justify-content: center; align-items: center; gap: 18px; text-align: center; }
        .busy-card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); width: 100%; max-width: 340px; }
        .btn-spectate { padding: 12px 20px; background: #3c1e1e; color: #fff; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 12px; width: 100%; }
        .btn-spectate:hover { background: #522b2b; }

        /* 직업 룰렛 오버레이 */
        #roulette-overlay { position: absolute; inset: 0; background: #000; z-index: 100; display: none; flex-direction: column; justify-content: center; align-items: center; }
        .roulette-box { font-size: 40px; font-weight: bold; color: #fee500; height: 60px; }
        .roulette-sub { margin-top: 15px; color: #888; font-size: 13px; }

        /* 인게임 메인 화면 */
        #ingame-view { flex: 1; display: none; flex-direction: column; height: 100%; position: relative; overflow: hidden; }
        .game-status-bar { padding: 10px 16px; background: #e4dfd5; font-size: 12px; font-weight: bold; color: #333; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.05); }

        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message-box { display: flex; flex-direction: column; max-width: 75%; position: relative; }
        .message-box.mine { align-self: flex-end; align-items: flex-end; }
        .message-box.other { align-self: flex-start; align-items: flex-start; }
        .message-box.system { align-self: center; align-items: center; max-width: 90%; }
        .sender-name { font-size: 11px; color: #555; margin-bottom: 3px; }
        
        .bubble { padding: 10px 14px; border-radius: 12px; font-size: 14px; word-break: break-all; line-height: 1.4; white-space: pre-wrap; }
        .mine .bubble { background-color: #fee500; color: #000; border-top-right-radius: 2px; }
        .other .bubble { background-color: #fff; color: #000; border-top-left-radius: 2px; }
        .system .bubble { background-color: rgba(0,0,0,0.12); color: #333; font-size: 12px; border-radius: 20px; padding: 6px 14px; text-align: center; }
        .system.secret .bubble { background-color: #3c1e1e; color: #fee500; font-weight: bold; }
        .system.alert .bubble { background-color: #d9534f; color: #fff; font-weight: bold; }
        .time { font-size: 9px; color: #777; margin-top: 2px; }

        .action-tray { padding: 8px 10px; background: #e8e3d8; display: none; flex-wrap: wrap; gap: 6px; border-top: 1px solid rgba(0,0,0,0.05); }
        .game-btn { flex: 1; min-width: 75px; padding: 8px 10px; border-radius: 6px; border: none; font-weight: bold; font-size: 12px; cursor: pointer; background: #3c1e1e; color: #fff; }
        .game-btn.skip { background: #777; }
        .game-btn.skill { background: #e056fd; }

        .chat-input-area { padding: 10px; background-color: #f0f0f0; display: flex; gap: 8px; align-items: center; }
        .chat-input-area input { flex: 1; padding: 10px; border: none; border-radius: 4px; font-size: 14px; outline: none; height: 38px; }
        .chat-input-area input:disabled { background: #e0e0e0; cursor: not-allowed; }
        .chat-input-area button { padding: 10px 16px; background-color: #fee500; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; height: 38px; }
        .chat-input-area button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="container">
        <div class="chat-header">
            <div class="header-title-area">
                <span id="room-title">마피아 게임</span>
                <span id="my-role-badge" class="my-role-badge"></span>
            </div>
            <span id="my-name-display" class="user-tag"></span>
        </div>

        <!-- 1. 대기실 (최소 4인 대기) -->
        <div id="lobby-view">
            <div class="player-count-card">
                <h3 style="color: #3c1e1e;">🕵️‍♂️ 마피아 대기실</h3>
                <p style="color: #666; font-size: 12px; margin-top: 4px;">게임을 시작하려면 최소 4명이 필요합니다.</p>
                <div class="count-text" id="lobby-player-count">1 / 4</div>
                <div class="timer-badge" id="lobby-timer-badge">참가자 대기 중...</div>
            </div>
        </div>

        <!-- 2. 게임 진행 중 난입 차단 / 관전 뷰 -->
        <div id="busy-view">
            <div class="busy-card">
                <span style="font-size: 36px;">🔒</span>
                <h3 style="color: #3c1e1e; margin-top: 8px;">현재 게임이 진행 중입니다</h3>
                <p style="color: #666; font-size: 13px; margin-top: 6px;">게임이 끝날 때까지 새 게임을 시작할 수 없습니다.</p>
                <button class="btn-spectate" onclick="spectateGame()">👀 실시간 채팅 관전하기</button>
            </div>
        </div>

        <!-- 3. 직업 룰렛 오버레이 -->
        <div id="roulette-overlay">
            <div class="roulette-box" id="roulette-text">시민</div>
            <div class="roulette-sub">직업을 배정받는 중입니다...</div>
        </div>

        <!-- 4. 인게임 메인 화면 -->
        <div id="ingame-view">
            <div class="game-status-bar">
                <span id="game-phase-name">게임 준비 중</span>
                <span id="game-phase-timer" style="color: #d9534f;"></span>
            </div>
            
            <div class="chat-messages" id="game-messages"></div>

            <div class="action-tray" id="action-tray"></div>

            <div class="chat-input-area">
                <input type="text" id="game-chat-input" placeholder="대화를 입력하세요..." onkeydown="if(event.key==='Enter') sendGameChat()">
                <button id="game-chat-send-btn" onclick="sendGameChat()">전송</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const myUsername = urlParams.get('username') || ('플레이어' + Math.floor(Math.random() * 1000));
        document.getElementById('my-name-display').innerText = `@${myUsername}`;

        const socket = io({ query: { username: myUsername } });
        let myRole = '';
        let isSpectating = false;
        let isChatAllowed = true;

        // 대기실 참가
        socket.emit('join_game_lobby');

        function setChatLock(locked, placeholder = '대화를 입력하세요...') {
            const input = document.getElementById('game-chat-input');
            const btn = document.getElementById('game-chat-send-btn');
            isChatAllowed = !locked;
            input.disabled = locked;
            btn.disabled = locked;
            input.placeholder = placeholder;
            if (!locked) input.focus();
        }

        socket.on('mafia_lobby_status', ({ currentCount, requiredCount, canStart }) => {
            document.getElementById('lobby-player-count').innerText = `${currentCount} / ${requiredCount}`;
            if (!canStart) {
                document.getElementById('lobby-timer-badge').innerText = `최소 ${requiredCount}명이 모여야 시작됩니다.`;
            }
        });

        socket.on('mafia_lobby_timer', (t) => {
            const badge = document.getElementById('lobby-timer-badge');
            if (t !== null && t !== undefined) {
                badge.innerText = `⏳ ${t}초 후 자동으로 게임이 시작됩니다!`;
            }
        });

        socket.on('game_already_running', () => {
            document.getElementById('lobby-view').style.display = 'none';
            document.getElementById('busy-view').style.display = 'flex';
        });

        function spectateGame() {
            isSpectating = true;
            document.getElementById('busy-view').style.display = 'none';
            document.getElementById('ingame-view').style.display = 'flex';
            document.getElementById('room-title').innerText = '마피아 게임 (관전 모드)';
            appendSystemMessage('👀 관전 모드로 입장하였습니다. 실시간 대화를 구경할 수 있습니다.');
            socket.emit('join_as_spectator');
        }

        socket.on('mafia_game_started', () => {
            document.getElementById('lobby-view').style.display = 'none';
            document.getElementById('busy-view').style.display = 'none';
            document.getElementById('ingame-view').style.display = 'flex';
            document.getElementById('game-messages').innerHTML = ''; // 이전 게임 메시지 완전 삭제
        });

        // 4명 미만으로 게임 중단 시 리셋
        socket.on('mafia_game_aborted', ({ reason }) => {
            alert(reason);
            document.getElementById('ingame-view').style.display = 'none';
            document.getElementById('busy-view').style.display = 'none';
            document.getElementById('lobby-view').style.display = 'flex';
            document.getElementById('my-role-badge').style.display = 'none';
            document.getElementById('room-title').innerText = '마피아 게임';
            myRole = '';
            isSpectating = false;
        });

        // 직업 배정 (상단 타이틀 옆에 내 직업 상시 표시)
        socket.on('mafia_assigned_role', ({ role }) => {
            if (isSpectating) return;
            myRole = role;

            const badge = document.getElementById('my-role-badge');
            badge.innerText = `내 직업: ${role}`;
            badge.style.display = 'inline-block';

            const overlay = document.getElementById('roulette-overlay');
            const rText = document.getElementById('roulette-text');
            overlay.style.display = 'flex';

            const roles = ['시민', '마피아', '경찰', '의사'];
            let count = 0;
            const timer = setInterval(() => {
                rText.innerText = roles[count % roles.length];
                count++;
                if (count > 25) {
                    clearInterval(timer);
                    rText.innerText = `당신의 직업: ${role}`;
                    setTimeout(() => overlay.style.display = 'none', 2500);
                }
            }, 100);
        });

        // 자기소개 페이즈: 차례인 사람만 채팅 가능
        socket.on('mafia_turn_intro', ({ currentSpeaker, index, total }) => {
            document.getElementById('game-phase-name').innerText = `자기소개 페이즈 (${index + 1}/${total})`;
            appendSystemMessage(`📢 [자기소개] @${currentSpeaker} 님의 발언 턴입니다.`);

            const tray = document.getElementById('action-tray');
            tray.innerHTML = '';

            if (currentSpeaker === myUsername && !isSpectating) {
                setChatLock(false, '자기소개를 입력하세요...');
                tray.style.display = 'flex';
                tray.innerHTML = `<button class="game-btn" onclick="finishIntro()">자기소개 마치기</button>`;
            } else {
                setChatLock(true, `@${currentSpeaker} 님이 발언 중입니다...`);
                tray.style.display = 'none';
            }
        });

        function finishIntro() {
            document.getElementById('action-tray').style.display = 'none';
            setChatLock(true, '자기소개가 끝났습니다.');
            socket.emit('mafia_intro_finish');
        }

        // 자유 토론: 모두 채팅 가능
        socket.on('mafia_day_talk_start', () => {
            document.getElementById('game-phase-name').innerText = '자유 토론';
            document.getElementById('action-tray').style.display = 'none';
            setChatLock(false, '자유롭게 대화하세요...');
            appendSystemMessage('☀️ 아침이 밝았습니다! 20초간 토론하세요.');
        });

        // 처형 투표 페이즈
        socket.on('mafia_vote_phase_start', ({ candidates }) => {
            document.getElementById('game-phase-name').innerText = '처형 투표';
            appendSystemMessage('🗳️ 의심되는 사람에게 투표하세요. (skip 가능)');

            if (isSpectating) return;

            const tray = document.getElementById('action-tray');
            tray.innerHTML = '';
            tray.style.display = 'flex';
            candidates.forEach(u => {
                tray.innerHTML += `<button class="game-btn" onclick="voteTarget('${u}')">${u}</button>`;
            });
            tray.innerHTML += `<button class="game-btn skip" onclick="voteTarget('skip')">스킵(건너뛰기)</button>`;
        });

        function voteTarget(target) {
            document.getElementById('action-tray').style.display = 'none';
            socket.emit('mafia_cast_vote', target);
        }

        socket.on('mafia_executed', ({ username, role }) => {
            if (username) appendSystemMessage(`⚖️ 투표 결과, @${username} (${role}) 님이 처형되었습니다.`);
            else appendSystemMessage(`⚖️ 동점 또는 스킵으로 인해 아무도 처형되지 않았습니다.`);
        });

        // 밤 페이즈: 모든 참가자 채팅 완전 차단
        socket.on('mafia_night_start', ({ candidates }) => {
            document.getElementById('game-phase-name').innerText = '밤 (스킬 사용)';
            appendSystemMessage('🌙 밤이 되었습니다.');

            // 밤에는 채팅 입력 비활성화
            setChatLock(true, '밤에는 채팅을 칠 수 없습니다...');

            if (isSpectating) return;

            const tray = document.getElementById('action-tray');
            tray.innerHTML = '';

            if (myRole === '마피아') {
                tray.style.display = 'flex';
                candidates.forEach(u => {
                    tray.innerHTML += `<button class="game-btn skill" onclick="useSkill('kill', '${u}')">처형: ${u}</button>`;
                });
            } else if (myRole === '의사') {
                tray.style.display = 'flex';
                candidates.forEach(u => {
                    tray.innerHTML += `<button class="game-btn skill" onclick="useSkill('heal', '${u}')">치료: ${u}</button>`;
                });
            } else if (myRole === '경찰') {
                tray.style.display = 'flex';
                candidates.forEach(u => {
                    tray.innerHTML += `<button class="game-btn skill" onclick="useSkill('investigate', '${u}')">조사: ${u}</button>`;
                });
            } else {
                tray.style.display = 'none';
                appendSystemMessage('시민은 아침을 기다립니다...');
            }
        });

        function useSkill(action, target) {
            document.getElementById('action-tray').style.display = 'none';
            socket.emit('mafia_night_action', { action, target });
        }

        socket.on('mafia_investigate_private_result', ({ target, isMafia }) => {
            appendSystemMessage(`🔍 [경찰 조사 결과] @${target} 님은 ${isMafia ? '마피아가 맞습니다! 🚨' : '선량한 시민입니다. ✅'}`, true);
        });

        socket.on('mafia_night_result', ({ killed }) => {
            if (killed) appendSystemMessage(`⚰️ 지난 밤, @${killed} 님이 마피아의 공격으로 사망하였습니다.`);
            else appendSystemMessage(`🛡️ 지난 밤에는 의사의 치료로 아무도 사망하지 않았습니다!`);
        });

        socket.on('mafia_timer_update', ({ timer }) => {
            document.getElementById('game-phase-timer').innerText = `${timer}초`;
        });

        socket.on('mafia_game_ended', ({ resultText }) => {
            appendSystemMessage(`🏁 [게임 종료] ${resultText}`, false, true);
            document.getElementById('game-phase-name').innerText = '게임 종료';
            document.getElementById('action-tray').style.display = 'none';
            setChatLock(true, '게임이 종료되었습니다.');
            setTimeout(() => {
                location.reload(); // 5초 후 대기실 새로고침
            }, 5000);
        });

        // 인게임 대화 전송
        function sendGameChat() {
            if (!isChatAllowed) return;
            const input = document.getElementById('game-chat-input');
            const val = input.value.trim();
            if (!val) return;
            socket.emit('game_chat_message', val);
            input.value = '';
        }

        socket.on('game_chat_broadcast', (data) => {
            appendUserMessage(data);
        });

        function appendUserMessage(data) {
            const chatMessages = document.getElementById('game-messages');
            const isMine = data.username === myUsername;

            const box = document.createElement('div');
            box.className = `message-box ${isMine ? 'mine' : 'other'}`;

            if (!isMine) {
                const nameDiv = document.createElement('div');
                nameDiv.className = 'sender-name';
                nameDiv.innerText = data.username;
                box.appendChild(nameDiv);
            }

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerText = data.message;
            box.appendChild(bubble);

            const time = document.createElement('span');
            time.className = 'time';
            time.innerText = data.time;
            box.appendChild(time);

            chatMessages.appendChild(box);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendSystemMessage(text, isSecret = false, isAlert = false) {
            const chatMessages = document.getElementById('game-messages');
            const box = document.createElement('div');
            box.className = `message-box system ${isSecret ? 'secret' : ''} ${isAlert ? 'alert' : ''}`;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerText = text;
            box.appendChild(bubble);
            chatMessages.appendChild(box);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
