<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1-1 채팅</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body { background-color: #abc1d1; display: flex; justify-content: center; align-items: center; height: 100vh; height: 100dvh; }
        
        .container { width: 100%; max-width: 480px; height: 100%; max-height: 100vh; background-color: #efeae2; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        @media (min-width: 481px) {
            .container { height: 85vh; max-height: 750px; border-radius: 12px; overflow: hidden; }
        }
        
        #auth-screen { padding: 30px 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; background: #fee500; }
        #auth-screen h2 { margin-bottom: 20px; color: #3c1e1e; }
        .input-group { width: 100%; max-width: 320px; margin-bottom: 10px; }
        .input-group input { width: 100%; padding: 12px; border: none; border-radius: 4px; font-size: 14px; outline: none; }
        .btn-group { width: 100%; max-width: 320px; display: flex; gap: 10px; margin-top: 10px; }
        .btn-group button { flex: 1; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-login { background-color: #3c1e1e; color: #fff; }
        .btn-signup { background-color: #fff; color: #3c1e1e; }
        .error-msg { color: #d9534f; margin-top: 10px; font-size: 13px; text-align: center; }

        #chat-screen { display: none; flex-direction: column; height: 100%; position: relative; }
        .chat-header { background-color: #1f1f1f; color: #fff; padding: 12px 16px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        
        #user-list-btn { background: #333; color: #fff; border: 1px solid #555; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
        #user-list-btn:hover { background: #444; }

        .chat-messages-wrapper { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .message-box { display: flex; flex-direction: column; max-width: 75%; cursor: pointer; position: relative; }
        .message-box.mine { align-self: flex-end; align-items: flex-end; }
        .message-box.other { align-self: flex-start; align-items: flex-start; }
        .sender-name { font-size: 11px; color: #555; margin-bottom: 3px; }
        
        .bubble { padding: 10px 14px; border-radius: 12px; font-size: 14px; word-break: break-all; position: relative; line-height: 1.4; white-space: pre-wrap; }
        .mine .bubble { background-color: #fee500; color: #000; border-top-right-radius: 2px; }
        .other .bubble { background-color: #fff; color: #000; border-top-left-radius: 2px; }
        
        .time { font-size: 9px; color: #777; margin-top: 2px; align-self: flex-end; }
        .mine .time { align-self: flex-end; }
        .other .time { align-self: flex-end; }
        .read-status { font-size: 10px; color: #888; margin-top: 2px; }
        .mine .read-status { align-self: flex-end; }
        .other .read-status { align-self: flex-start; }

        .reply-quote { background: rgba(0,0,0,0.06); padding: 4px 8px; border-radius: 4px; font-size: 11px; color: #444; margin-bottom: 4px; border-left: 3px solid #3c1e1e; }
        .chat-image { max-width: 200px; max-height: 200px; border-radius: 8px; margin-top: 4px; display: block; }

        /* Reactions under message */
        .reaction-container {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
        }
        .mine .reaction-container { justify-content: flex-end; }
        .other .reaction-container { justify-content: flex-start; }

        .reaction-badge {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 2px 6px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            user-select: none;
        }
        .reaction-badge.my-reaction {
            background: #eef3fc;
            border-color: #1877f2;
        }

        .chat-input-area { padding: 10px; background-color: #f0f0f0; display: flex; flex-direction: column; gap: 6px; position: relative; }
        .input-row { display: flex; gap: 8px; align-items: center; width: 100%; }
        .btn-attach { background: #ddd; border: none; width: 36px; height: 36px; border-radius: 4px; font-weight: bold; font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center; color: #555; }
        .btn-attach:hover { background: #ccc; }
        .chat-input-area textarea { flex: 1; padding: 10px; border: none; border-radius: 4px; font-size: 14px; outline: none; resize: none; height: 38px; line-height: 18px; }
        .chat-input-area button.send-btn { padding: 10px 16px; background-color: #fee500; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; height: 38px; }

        #reply-preview-bar { display: none; justify-content: space-between; align-items: center; background: #e4dfd5; padding: 4px 8px; border-radius: 4px; font-size: 12px; color: #333; }
        #reply-preview-bar button { background: none; border: none; font-weight: bold; cursor: pointer; color: #777; }

        #typing-notice { font-size: 11px; color: #666; padding: 0 4px; min-height: 16px; }

        #new-message-banner {
            display: none;
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(31, 31, 31, 0.9);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10;
            white-space: nowrap;
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
            align-items: center;
            gap: 6px;
        }

        #scroll-bottom-btn {
            display: none;
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: #ffffff;
            color: #333;
            border: 1px solid #ccc;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 10;
            justify-content: center;
            align-items: center;
        }
        #scroll-bottom-btn:hover { background: #f0f0f0; }

        #user-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 20; }
        .modal-content { background: #fff; width: 85%; max-width: 300px; height: 75%; max-height: 400px; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .modal-scroll-area { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 4px; }
        
        .modal-section-title { font-size: 13px; font-weight: bold; color: #555; margin-bottom: 4px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
        .modal-user-list { list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #444; }
        .modal-user-list li { padding: 6px 8px; background: #f9f9f9; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        
        .user-name-span { display: flex; align-items: center; gap: 6px; }
        .online-dot::before { content: "●"; color: #2ecc71; font-size: 10px; }
        .offline-dot::before { content: "●"; color: #bbb; font-size: 10px; }
        .user-time-span { font-size: 11px; color: #888; }
        .modal-close-btn { align-self: flex-end; padding: 6px 12px; background: #ddd; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }

        #chat-menu-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); justify-content: center; align-items: center; z-index: 30; }
        .chat-menu-content { background: #fff; width: 220px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: flex; flex-direction: column; }
        
        /* Reaction quick-pick tray inside context menu */
        .reaction-pick-tray {
            display: flex;
            justify-content: space-around;
            padding: 10px 8px;
            background: #f7f7f7;
            border-bottom: 1px solid #eee;
        }
        .reaction-pick-item {
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .reaction-pick-item:hover { transform: scale(1.2); }

        .chat-menu-item { padding: 12px; text-align: center; border-bottom: 1px solid #eee; background: none; border: none; font-size: 14px; cursor: pointer; font-weight: bold; color: #333; }
        .chat-menu-item:last-child { border-bottom: none; }
        .chat-menu-item:hover { background: #f5f5f5; }
        .chat-menu-item.delete { color: #d9534f; }

        /* Reaction details tooltip / modal */
        #reaction-detail-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); justify-content: center; align-items: center; z-index: 40; }
        .reaction-detail-content { background: #fff; width: 200px; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .reaction-detail-title { font-size: 12px; font-weight: bold; color: #555; border-bottom: 1px solid #eee; padding-bottom: 4px; display: flex; align-items: center; gap: 4px; }
        .reaction-detail-list { font-size: 13px; color: #333; list-style: none; display: flex; flex-direction: column; gap: 4px; max-height: 120px; overflow-y: auto; }
        .reaction-detail-list li { padding: 4px 6px; background: #f9f9f9; border-radius: 4px; display: flex; justify-content: space-between; }

        /* Mention Dropdown */
        #mention-dropdown {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 10px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            max-height: 130px;
            overflow-y: auto;
            z-index: 40;
            width: 180px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .mention-item {
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            color: #333;
            border-bottom: 1px solid #eee;
        }
        .mention-item:last-child { border-bottom: none; }
        .mention-item:hover { background: #f0f0f0; }
        .mention-highlight { color: #0066ff; font-weight: bold; }

        /* Dark Mode Overrides */
        .container.dark-mode { background-color: #18191a !important; color: #e4e6eb !important; }
        .container.dark-mode .chat-header { background-color: #242526 !important; color: #e4e6eb !important; }
        .container.dark-mode #user-list-btn { background: #3a3b3c !important; border-color: #4e4f50 !important; color: #e4e6eb !important; }
        .container.dark-mode .chat-messages { background-color: #18191a !important; }
        .container.dark-mode .other .bubble { background-color: #242526 !important; color: #e4e6eb !important; }
        .container.dark-mode .mine .bubble { background-color: #d29922 !important; color: #000 !important; }
        .container.dark-mode .sender-name { color: #b0b3b8 !important; }
        .container.dark-mode .time { color: #b0b3b8 !important; }
        .container.dark-mode .read-status { color: #b0b3b8 !important; }
        .container.dark-mode .chat-input-area { background-color: #242526 !important; }
        .container.dark-mode .chat-input-area textarea { background-color: #3a3b3c !important; color: #e4e6eb !important; }
        .container.dark-mode .chat-input-area textarea::placeholder { color: #b0b3b8; }
        .container.dark-mode .btn-attach { background: #3a3b3c !important; color: #e4e6eb !important; }
        .container.dark-mode .send-btn { background-color: #d29922 !important; color: #000 !important; }
        .container.dark-mode #reply-preview-bar { background: #3a3b3c !important; color: #e4e6eb !important; }
        .container.dark-mode #reply-preview-bar button { color: #b0b3b8 !important; }
        .container.dark-mode #typing-notice { color: #b0b3b8 !important; }
        .container.dark-mode .reply-quote { background: rgba(255,255,255,0.1) !important; color: #e4e6eb !important; border-left-color: #d29922 !important; }
        .container.dark-mode .reaction-badge { background: #242526 !important; border-color: #3a3b3c !important; color: #e4e6eb !important; }
        .container.dark-mode .reaction-badge.my-reaction { background: #3a3b3c !important; border-color: #d29922 !important; }
        .container.dark-mode .chat-menu-content { background: #242526 !important; color: #e4e6eb !important; }
        .container.dark-mode .reaction-pick-tray { background: #18191a !important; border-bottom: 1px solid #3a3b3c !important; }
        .container.dark-mode .chat-menu-item { color: #e4e6eb !important; border-bottom: 1px solid #3a3b3c !important; }
        .container.dark-mode .chat-menu-item:hover { background: #3a3b3c !important; }
        .container.dark-mode .reaction-detail-content { background: #242526 !important; color: #e4e6eb !important; }
        .container.dark-mode .reaction-detail-title { border-bottom: 1px solid #3a3b3c !important; color: #b0b3b8 !important; }
        .container.dark-mode .reaction-detail-list li { background: #3a3b3c !important; color: #e4e6eb !important; }
        .container.dark-mode #mention-dropdown { background: #242526 !important; border-color: #3a3b3c !important; }
        .container.dark-mode .mention-item { color: #e4e6eb !important; border-bottom: 1px solid #3a3b3c !important; }
        .container.dark-mode .mention-item:hover { background: #3a3b3c !important; }
    </style>
</head>
<body>

    <div class="container">
        <div id="auth-screen">
            <h2>1-1 채팅</h2>
            <div class="input-group">
                <input type="text" id="username" placeholder="닉네임">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="비밀번호">
            </div>
            <div class="btn-group">
                <button class="btn-login" onclick="login()">로그인</button>
                <button class="btn-signup" onclick="signup()">회원가입</button>
            </div>
            <div id="auth-error" class="error-msg"></div>
        </div>

        <div id="chat-screen">
            <div class="chat-header">
                <span id="room-title" onclick="handleTitleClick()" style="cursor: pointer;">1-1 채팅</span>
                <button id="user-list-btn" onclick="toggleUserModal()">온라인유저 확인</button>
            </div>
            
            <div class="chat-messages-wrapper">
                <div class="chat-messages" id="chat-messages" onscroll="handleScroll()">
                </div>
                <div id="new-message-banner" onclick="scrollToBottom()">
                    <span id="banner-text">새 메시지가 도착했습니다.</span> ▾
                </div>
                <button id="scroll-bottom-btn" onclick="scrollToBottom()">↓</button>
            </div>

            <div class="chat-input-area">
                <div id="mention-dropdown"></div>
                <div id="reply-preview-bar">
                    <span id="reply-preview-text"></span>
                    <button onclick="cancelReply()">✕</button>
                </div>
                <div id="typing-notice"></div>
                <div class="input-row">
                    <button class="btn-attach" onclick="document.getElementById('image-input').click()">+</button>
                    <input type="file" id="image-input" accept="image/*" style="display: none;" onchange="sendImage(this)">
                    
                    <textarea id="message-input" placeholder="메시지를 입력하세요..." oninput="handleMessageInput()" onkeydown="handleKeyDown(event)"></textarea>
                    <button class="send-btn" onclick="sendMessage()">전송</button>
                </div>
            </div>

            <div id="user-modal" onclick="if(event.target === this) toggleUserModal()">
                <div class="modal-content">
                    <div class="modal-scroll-area">
                        <div>
                            <div class="modal-section-title">온라인 유저</div>
                            <ul id="online-users-list" class="modal-user-list"></ul>
                        </div>
                        <div style="margin-top: 10px;">
                            <div class="modal-section-title">멤버</div>
                            <ul id="all-members-list" class="modal-user-list"></ul>
                        </div>
                    </div>
                    <button class="modal-close-btn" onclick="toggleUserModal()">닫기</button>
                </div>
            </div>

            <div id="chat-menu-modal" onclick="if(event.target === this) closeChatMenu()">
                <div class="chat-menu-content" id="chat-menu-box">
                    <div class="reaction-pick-tray">
                        <span class="reaction-pick-item" onclick="actionReact('❤️')">❤️</span>
                        <span class="reaction-pick-item" onclick="actionReact('👍')">👍</span>
                        <span class="reaction-pick-item" onclick="actionReact('✅')">✅</span>
                        <span class="reaction-pick-item" onclick="actionReact('😄')">😄</span>
                        <span class="reaction-pick-item" onclick="actionReact('😢')">😢</span>
                        <span class="reaction-pick-item" onclick="actionReact('🔥')">🔥</span>
                    </div>
                    <button class="chat-menu-item" onclick="actionReply()">답장하기</button>
                </div>
            </div>

            <div id="reaction-detail-modal" onclick="if(event.target === this) closeReactionDetail()">
                <div class="reaction-detail-content">
                    <div class="reaction-detail-title" id="reaction-detail-title"></div>
                    <ul id="reaction-detail-list" class="reaction-detail-list"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        let socket;
        let myUsername = '';
        let currentReply = null; 
        let typingTimer;
        let selectedMessageData = null; 
        let currentOnlineUserSet = new Set();
        let lastMarkedMessageId = null; 
        let titleClickCount = 0;
        let isDarkMode = false;
        let cachedMembers = [];

        const AVAILABLE_REACTIONS = ['❤️', '👍', '✅', '😄', '😢', '🔥'];

        function handleTitleClick() {
            titleClickCount++;
            if (titleClickCount >= 10) {
                titleClickCount = 0;
                isDarkMode = !isDarkMode;
                document.querySelector('.container').classList.toggle('dark-mode', isDarkMode);
            }
        }

        function formatRelativeTime(timestamp, isOnline) {
            if (isOnline) return '현재 활동 중';
            if (!timestamp) return '활동 기록 없음';
            
            const diffSeconds = Math.floor((Date.now() - timestamp) / 1000);
            if (diffSeconds < 60) return '방금전 활동';
            const diffMinutes = Math.floor(diffSeconds / 60);
            if (diffMinutes < 60) return `${diffMinutes}분 전 활동`;
            const diffHours = Math.floor(diffMinutes / 60);
            if (diffHours < 24) return `${diffHours}시간 전 활동`;
            const diffDays = Math.floor(diffHours / 24);
            return `${diffDays}일 전 활동`;
        }

        async function signup() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            if(!username || !password) {
                document.getElementById('auth-error').innerText = '닉네임과 비밀번호를 입력해주세요.';
                return;
            }
            const res = await fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            document.getElementById('auth-error').innerText = data.message;
        }

        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            if(!username || !password) {
                document.getElementById('auth-error').innerText = '닉네임과 비밀번호를 입력해주세요.';
                return;
            }
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                myUsername = username;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'flex';
                initSocket();
            } else {
                document.getElementById('auth-error').innerText = data.message;
            }
        }

        function initSocket() {
            socket = io({
                query: { username: myUsername }
            });

            socket.on('load_history', (history) => {
                const chatMessages = document.getElementById('chat-messages');
                chatMessages.innerHTML = '';
                history.forEach((data, index) => {
                    const isLast = (index === history.length - 1);
                    appendMessage(data, false, isLast);
                });
                scrollToBottom();
            });

            socket.on('receive_message', (data) => {
                const chatMessages = document.getElementById('chat-messages');
                const lastMsg = chatMessages.lastElementChild;
                if (lastMsg) {
                    const oldReadEl = lastMsg.querySelector('.read-status');
                    if (oldReadEl) oldReadEl.remove();
                }
                appendMessage(data, true, true);
            });

            socket.on('message_read_updated', ({ messageId, readBy }) => {
                const msgEl = document.getElementById(`msg-${messageId}`);
                if (msgEl) {
                    updateReadStatusElement(msgEl, readBy);
                }
            });

            socket.on('message_deleted', (messageId) => {
                const msgEl = document.getElementById(`msg-${messageId}`);
                if (msgEl) msgEl.remove();
            });

            socket.on('reaction_updated', ({ messageId, reactions }) => {
                const msgEl = document.getElementById(`msg-${messageId}`);
                if (msgEl) {
                    const container = msgEl.querySelector('.reaction-container');
                    if (container) {
                        renderReactions(container, reactions, getMessageData(msgEl));
                    }
                }
            });

            socket.on('update_user_list', ({ onlineList, allMembers }) => {
                currentOnlineUserSet = new Set(onlineList);
                cachedMembers = allMembers.map(m => m.username);

                const onlineUl = document.getElementById('online-users-list');
                onlineUl.innerHTML = '';
                onlineList.forEach(username => {
                    const li = document.createElement('li');
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'user-name-span online-dot';
                    nameSpan.innerText = username;
                    li.appendChild(nameSpan);
                    onlineUl.appendChild(li);
                });

                const membersUl = document.getElementById('all-members-list');
                membersUl.innerHTML = '';
                allMembers.forEach(member => {
                    const li = document.createElement('li');
                    const isOnline = currentOnlineUserSet.has(member.username);
                    
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'user-name-span';
                    nameSpan.classList.add(isOnline ? 'online-dot' : 'offline-dot');
                    nameSpan.innerText = member.username;

                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'user-time-span';
                    timeSpan.innerText = formatRelativeTime(member.lastActive, isOnline);

                    li.appendChild(nameSpan);
                    li.appendChild(timeSpan);
                    membersUl.appendChild(li);
                });
            });

            socket.on('update_typing', (users) => {
                const otherTyping = users.filter(u => u !== myUsername);
                const noticeEl = document.getElementById('typing-notice');
                if (otherTyping.length === 0) {
                    noticeEl.innerText = '';
                } else if (otherTyping.length === 1) {
                    noticeEl.innerText = `${otherTyping[0]}님이 입력 중입니다...`;
                } else {
                    noticeEl.innerText = `${otherTyping[0]}님 외 ${otherTyping.length - 1}명이 입력 중입니다...`;
                }
            });
        }

        function getMessageData(msgEl) {
            return {
                _id: msgEl.dataset.id,
                username: msgEl.dataset.username,
                message: msgEl.dataset.message,
                image: msgEl.dataset.image
            };
        }

        function toggleUserModal() {
            const modal = document.getElementById('user-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function handleMessageInput() {
            handleTyping();
            checkMentionTrigger();
        }

        function handleTyping() {
            socket.emit('typing', true);
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => {
                socket.emit('typing', false);
            }, 1500);
        }

        function checkMentionTrigger() {
            const input = document.getElementById('message-input');
            const val = input.value;
            const pos = input.selectionStart;
            
            const textBeforeCursor = val.substring(0, pos);
            const lastAtIndex = textBeforeCursor.lastIndexOf('@');
            const dropdown = document.getElementById('mention-dropdown');
            
            if (lastAtIndex !== -1) {
                const query = textBeforeCursor.substring(lastAtIndex + 1);
                if (!/\s/.test(query)) {
                    showMentionDropdown(query, lastAtIndex);
                    return;
                }
            }
            dropdown.style.display = 'none';
        }

        function showMentionDropdown(query, atIndex) {
            const dropdown = document.getElementById('mention-dropdown');
            dropdown.innerHTML = '';
            
            const filtered = cachedMembers.filter(m => m.toLowerCase().includes(query.toLowerCase()));
            if (filtered.length === 0) {
                dropdown.style.display = 'none';
                return;
            }
            
            filtered.forEach(name => {
                const item = document.createElement('div');
                item.className = 'mention-item';
                item.innerText = '@' + name;
                item.onclick = () => {
                    insertMention(name, atIndex);
                };
                dropdown.appendChild(item);
            });
            dropdown.style.display = 'block';
        }

        function insertMention(username, atIndex) {
            const input = document.getElementById('message-input');
            const val = input.value;
            const pos = input.selectionStart;
            
            const before = val.substring(0, atIndex);
            const after = val.substring(pos);
            
            input.value = before + '@' + username + ' ' + after;
            input.focus();
            const newPos = atIndex + username.length + 2;
            input.setSelectionRange(newPos, newPos);
            
            document.getElementById('mention-dropdown').style.display = 'none';
        }

        function handleKeyDown(event) {
            const dropdown = document.getElementById('mention-dropdown');
            if (dropdown.style.display === 'flex' || dropdown.style.display === 'block') {
                if (event.key === 'Escape') {
                    dropdown.style.display = 'none';
                }
            }
            if (event.isComposing || event.keyCode === 229) return;
            if (event.key === 'Enter') {
                if (event.shiftKey) return;
                else {
                    event.preventDefault();
                    sendMessage();
                }
            }
        }

        function scrollToBottom() {
            const chatMessages = document.getElementById('chat-messages');
            chatMessages.scrollTop = chatMessages.scrollHeight;
            document.getElementById('new-message-banner').style.display = 'none';
            document.getElementById('scroll-bottom-btn').style.display = 'none';
            checkAndMarkLastMessageRead();
        }

        function handleScroll() {
            const chatMessages = document.getElementById('chat-messages');
            const distanceToBottom = chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight;
            
            if (distanceToBottom > 30) {
                document.getElementById('scroll-bottom-btn').style.display = 'flex';
            } else {
                document.getElementById('new-message-banner').style.display = 'none';
                document.getElementById('scroll-bottom-btn').style.display = 'none';
                checkAndMarkLastMessageRead();
            }
        }

        function checkAndMarkLastMessageRead() {
            const chatMessages = document.getElementById('chat-messages');
            const distanceToBottom = chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight;
            if (distanceToBottom <= 30) {
                const lastMsg = chatMessages.lastElementChild;
                if (lastMsg && lastMsg.dataset.id) {
                    if (lastMarkedMessageId !== lastMsg.dataset.id) {
                        lastMarkedMessageId = lastMsg.dataset.id;
                        socket.emit('mark_read', lastMsg.dataset.id);
                    }
                }
            }
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            if (!message && !currentReply) return;

            const now = new Date();
            const timeString = now.toLocaleTimeString('ko-KR', {
                timeZone: 'Asia/Seoul',
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });

            socket.emit('send_message', {
                username: myUsername,
                message: message,
                time: timeString,
                replyTo: currentReply
            });

            input.value = '';
            document.getElementById('mention-dropdown').style.display = 'none';
            socket.emit('typing', false);
            cancelReply();
            input.focus();
        }

        function sendImage(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    const now = new Date();
                    const timeString = now.toLocaleTimeString('ko-KR', {
                        timeZone: 'Asia/Seoul',
                        hour: '2-digit',
                        minute: '2-digit',
                        hour12: true
                    });

                    socket.emit('send_message', {
                        username: myUsername,
                        message: '',
                        image: e.target.result,
                        time: timeString,
                        replyTo: currentReply
                    });
                    cancelReply();
                    input.value = ''; 
                };
                reader.readAsDataURL(file);
            }
        }

        function setReply(username, text) {
            currentReply = { username, text: text || '[이미지]' };
            document.getElementById('reply-preview-text').innerText = `${username}: ${currentReply.text}`;
            document.getElementById('reply-preview-bar').style.display = 'flex';
            document.getElementById('message-input').focus();
        }

        function cancelReply() {
            currentReply = null;
            document.getElementById('reply-preview-bar').style.display = 'none';
        }

        function openChatMenu(data) {
            selectedMessageData = data;
            const menuModal = document.getElementById('chat-menu-modal');
            const menuBox = document.getElementById('chat-menu-box');
            
            let html = `
                <div class="reaction-pick-tray">
                    <span class="reaction-pick-item" onclick="actionReact('❤️')">❤️</span>
                    <span class="reaction-pick-item" onclick="actionReact('👍')">👍</span>
                    <span class="reaction-pick-item" onclick="actionReact('✅')">✅</span>
                    <span class="reaction-pick-item" onclick="actionReact('😄')">😄</span>
                    <span class="reaction-pick-item" onclick="actionReact('😢')">😢</span>
                    <span class="reaction-pick-item" onclick="actionReact('🔥')">🔥</span>
                </div>
                <button class="chat-menu-item" onclick="actionReply()">답장하기</button>
            `;

            if (data.username === myUsername && data._id) {
                html += `<button class="chat-menu-item delete" onclick="actionDelete()">삭제하기</button>`;
            }

            menuBox.innerHTML = html;
            menuModal.style.display = 'flex';
        }

        function closeChatMenu() {
            document.getElementById('chat-menu-modal').style.display = 'none';
        }

        function actionReply() {
            closeChatMenu();
            if (selectedMessageData) {
                setReply(selectedMessageData.username, selectedMessageData.message);
            }
        }

        function actionDelete() {
            closeChatMenu();
            if (selectedMessageData && selectedMessageData._id) {
                socket.emit('delete_message', selectedMessageData._id);
            }
        }

        function actionReact(emoji) {
            closeChatMenu();
            if (selectedMessageData && selectedMessageData._id) {
                socket.emit('toggle_reaction', { messageId: selectedMessageData._id, emoji });
            }
        }

        function handleReactionBadgeClick(messageId, emoji, reactions) {
            socket.emit('toggle_reaction', { messageId, emoji });
        }

        function showReactionDetail(emoji, users) {
            const modal = document.getElementById('reaction-detail-modal');
            const titleEl = document.getElementById('reaction-detail-title');
            const listEl = document.getElementById('reaction-detail-list');

            titleEl.innerHTML = `<span>${emoji}</span> 반응한 사람 (${users.length})`;
            listEl.innerHTML = '';
            users.forEach(user => {
                const li = document.createElement('li');
                li.innerText = user;
                listEl.appendChild(li);
            });

            modal.style.display = 'flex';
        }

        function closeReactionDetail() {
            document.getElementById('reaction-detail-modal').style.display = 'none';
        }

        function updateReadStatusElement(boxEl, readBy) {
            let readEl = boxEl.querySelector('.read-status');
            if (!readEl) {
                readEl = document.createElement('div');
                readEl.className = 'read-status';
                boxEl.appendChild(readEl);
            }

            const othersWhoRead = (readBy || []).filter(u => u !== myUsername);
            if (othersWhoRead.length === 0) {
                readEl.innerText = '';
            } else if (othersWhoRead.length === 1) {
                readEl.innerText = `${othersWhoRead[0]} 읽음`;
            } else if (othersWhoRead.length === 2) {
                readEl.innerText = `${othersWhoRead[0]}, ${othersWhoRead[1]} 읽음`;
            } else {
                readEl.innerText = `${othersWhoRead[0]}, ${othersWhoRead[1]} 외 ${othersWhoRead.length - 2}명 읽음`;
            }
        }

        function formatMessageText(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            let escaped = div.innerHTML;
            
            escaped = escaped.replace(/@([^\s]+)/g, (match) => {
                return `<span class="mention-highlight">${match}</span>`;
            });
            return escaped;
        }

        function renderReactions(containerEl, reactions, messageData) {
            containerEl.innerHTML = '';
            if (!reactions) return;

            for (const [emoji, users] of Object.entries(reactions)) {
                if (!users || users.length === 0) continue;

                const badge = document.createElement('div');
                badge.className = 'reaction-badge';
                const isMyReaction = users.includes(myUsername);
                if (isMyReaction) {
                    badge.classList.add('my-reaction');
                }

                badge.innerHTML = `<span>${emoji}</span><span>${users.length}</span>`;

                badge.onclick = (e) => {
                    e.stopPropagation();
                    handleReactionBadgeClick(messageData._id, emoji, reactions);
                };

                badge.oncontextmenu = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    showReactionDetail(emoji, users);
                };

                let pressTimer;
                badge.ontouchstart = (e) => {
                    pressTimer = setTimeout(() => {
                        e.preventDefault();
                        showReactionDetail(emoji, users);
                    }, 600);
                };
                badge.ontouchend = () => {
                    clearTimeout(pressTimer);
                };

                containerEl.appendChild(badge);
            }
        }

        function appendMessage(data, isNewMessage, isLastMessage = false) {
            const chatMessages = document.getElementById('chat-messages');
            const distanceToBottom = chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight;
            const isScrolledUp = distanceToBottom > 30;
            const isMine = data.username === myUsername;

            const box = document.createElement('div');
            box.className = `message-box ${isMine ? 'mine' : 'other'}`;
            if (data._id) {
                box.id = `msg-${data._id}`;
                box.dataset.id = data._id;
            }
            box.dataset.username = data.username;
            box.dataset.message = data.message || '';
            box.dataset.image = data.image || '';

            box.oncontextmenu = (e) => {
                e.preventDefault();
                openChatMenu(data);
            };

            let pressTimer;
            box.ontouchstart = (e) => {
                if (e.target.closest('.reaction-badge')) return;
                pressTimer = setTimeout(() => {
                    openChatMenu(data);
                }, 600);
            };
            box.ontouchend = () => {
                clearTimeout(pressTimer);
            };
            box.ontouchmove = () => {
                clearTimeout(pressTimer);
            };

            if (!isMine) {
                const nameDiv = document.createElement('div');
                nameDiv.className = 'sender-name';
                nameDiv.innerText = data.username;
                box.appendChild(nameDiv);
            }

            if (data.replyTo) {
                const quoteDiv = document.createElement('div');
                quoteDiv.className = 'reply-quote';
                quoteDiv.innerText = `↳ ${data.replyTo.username}: ${data.replyTo.text}`;
                box.appendChild(quoteDiv);
            }

            if (data.message) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.innerHTML = formatMessageText(data.message);
                box.appendChild(bubble);
            }

            if (data.image) {
                const img = document.createElement('img');
                img.src = data.image;
                img.className = 'chat-image';
                box.appendChild(img);
            }

            const reactionContainer = document.createElement('div');
            reactionContainer.className = 'reaction-container';
            renderReactions(reactionContainer, data.reactions, data);
            box.appendChild(reactionContainer);

            const time = document.createElement('span');
            time.className = 'time';
            time.innerText = data.time || new Date().toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: true });
            box.appendChild(time);

            chatMessages.appendChild(box);

            if (isLastMessage) {
                updateReadStatusElement(box, data.readBy);
            }

            if (!isNewMessage || !isScrolledUp) {
                chatMessages.scrollTop = chatMessages.scrollHeight;
                document.getElementById('new-message-banner').style.display = 'none';
                document.getElementById('scroll-bottom-btn').style.display = 'none';
            } else {
                const bannerText = document.getElementById('banner-text');
                const contentSummary = data.message ? data.message : '[사진]';
                bannerText.innerText = `${data.username}: ${contentSummary}`;
                document.getElementById('new-message-banner').style.display = 'flex';
                document.getElementById('scroll-bottom-btn').style.display = 'flex';
            }
        }
    </script>
</body>
</html>
