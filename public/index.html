<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1-1 채팅</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body { background-color: #abc1d1; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .container { width: 100%; max-width: 400px; height: 100%; max-height: 700px; background-color: #efeae2; display: flex; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        
        /* 인증 화면 */
        #auth-screen { padding: 40px 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; background: #fee500; }
        #auth-screen h2 { margin-bottom: 20px; color: #3c1e1e; }
        .input-group { width: 100%; margin-bottom: 10px; }
        .input-group input { width: 100%; padding: 12px; border: none; border-radius: 4px; font-size: 14px; }
        .btn-group { width: 100%; display: flex; gap: 10px; margin-top: 10px; }
        .btn-group button { flex: 1; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-login { background-color: #3c1e1e; color: #fff; }
        .btn-signup { background-color: #fff; color: #3c1e1e; }
        .error-msg { color: #d9534f; margin-top: 10px; font-size: 13px; text-align: center; }

        /* 채팅 화면 */
        #chat-screen { display: none; flex-direction: column; height: 100%; }
        .chat-header { background-color: #1f1f1f; color: #fff; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .message-box { display: flex; flex-direction: column; max-width: 70%; }
        .message-box.mine { align-self: flex-end; align-items: flex-end; }
        .message-box.other { align-self: flex-start; align-items: flex-start; }
        .sender-name { font-size: 11px; color: #555; margin-bottom: 3px; }
        
        .bubble { padding: 10px 14px; border-radius: 12px; font-size: 14px; word-break: break-all; position: relative; }
        .mine .bubble { background-color: #fee500; color: #000; border-top-right-radius: 2px; }
        .other .bubble { background-color: #fff; color: #000; border-top-left-radius: 2px; }
        
        .time { font-size: 9px; color: #777; margin-top: 2px; align-self: flex-end; }

        .chat-input-area { padding: 10px; background-color: #f0f0f0; display: flex; gap: 8px; }
        .chat-input-area input { flex: 1; padding: 10px; border: none; border-radius: 4px; font-size: 14px; }
        .chat-input-area button { padding: 10px 16px; background-color: #fee500; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 로그인/회원가입 영역 -->
        <div id="auth-screen">
            <h2>채팅</h2>
            <div class="input-group">
                <input type="text" id="username" placeholder="닉네임">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="비밀번호">
            </div>
            <div class="btn-group">
                <button class="btn-login" onclick="login()">로그인</button>
                <button class="btn-signup" onclick="signup()">회원가입</button>
            </div>
            <div id="auth-error" class="error-msg"></div>
        </div>

        <!-- 채팅방 영역 -->
        <div id="chat-screen">
            <div class="chat-header">
                <span id="room-title">클라우드 DB 실시간 오픈채팅</span>
                <span id="current-user" style="font-size: 12px; color: #aaa;"></span>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="message-input" placeholder="메시지를 입력하세요..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()">전송</button>
            </div>
        </div>
    </div>

    <script>
        let socket;
        let myUsername = '';

        async function signup() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if(!username || !password) {
                document.getElementById('auth-error').innerText = '닉네임과 비밀번호를 입력해주세요.';
                return;
            }

            const res = await fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            document.getElementById('auth-error').innerText = data.message;
        }

        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if(!username || !password) {
                document.getElementById('auth-error').innerText = '닉네임과 비밀번호를 입력해주세요.';
                return;
            }

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            
            if (data.success) {
                myUsername = username;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'flex';
                document.getElementById('current-user').innerText = `${myUsername}님 접속중`;
                initSocket();
            } else {
                document.getElementById('auth-error').innerText = data.message;
            }
        }

        function initSocket() {
            socket = io();

            socket.on('load_history', (history) => {
                history.forEach(data => appendMessage(data));
            });

            socket.on('receive_message', (data) => {
                appendMessage(data);
            });
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            if (!message) return;

            socket.emit('send_message', { username: myUsername, message });
            input.value = '';
        }

        function appendMessage(data) {
            const chatMessages = document.getElementById('chat-messages');
            const isMine = data.username === myUsername;

            const box = document.createElement('div');
            box.className = `message-box ${isMine ? 'mine' : 'other'}`;

            if (!isMine) {
                const nameDiv = document.createElement('div');
                nameDiv.className = 'sender-name';
                nameDiv.innerText = data.username;
                box.appendChild(nameDiv);
            }

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerText = data.message;
            box.appendChild(bubble);

            const time = document.createElement('span');
            time.className = 'time';
            time.innerText = data.time;
            box.appendChild(time);

            chatMessages.appendChild(box);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
