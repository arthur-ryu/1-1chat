<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1-1 채팅</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body { background-color: #abc1d1; display: flex; justify-content: center; align-items: center; height: 100vh; height: 100dvh; }
        
        .container { width: 100%; max-width: 480px; height: 100%; max-height: 100vh; background-color: #efeae2; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        @media (min-width: 481px) {
            .container { height: 85vh; max-height: 750px; border-radius: 12px; overflow: hidden; }
        }
        
        /* 인증 화면 */
        #auth-screen { padding: 30px 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; background: #fee500; }
        #auth-screen h2 { margin-bottom: 20px; color: #3c1e1e; }
        .input-group { width: 100%; max-width: 320px; margin-bottom: 10px; }
        .input-group input { width: 100%; padding: 12px; border: none; border-radius: 4px; font-size: 14px; outline: none; }
        .btn-group { width: 100%; max-width: 320px; display: flex; gap: 10px; margin-top: 10px; }
        .btn-group button { flex: 1; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-login { background-color: #3c1e1e; color: #fff; }
        .btn-signup { background-color: #fff; color: #3c1e1e; }
        .error-msg { color: #d9534f; margin-top: 10px; font-size: 13px; text-align: center; }

        /* 채팅 화면 */
        #chat-screen { display: none; flex-direction: column; height: 100%; position: relative; }
        .chat-header { background-color: #1f1f1f; color: #fff; padding: 12px 16px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        
        /* 온라인 유저 확인 버튼 */
        #user-list-btn { background: #333; color: #fff; border: 1px solid #555; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
        #user-list-btn:hover { background: #444; }

        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; position: relative; }
        
        .message-box { display: flex; flex-direction: column; max-width: 75%; cursor: pointer; }
        .message-box.mine { align-self: flex-end; align-items: flex-end; }
        .message-box.other { align-self: flex-start; align-items: flex-start; }
        .sender-name { font-size: 11px; color: #555; margin-bottom: 3px; }
        
        .bubble { padding: 10px 14px; border-radius: 12px; font-size: 14px; word-break: break-all; position: relative; line-height: 1.4; white-space: pre-wrap; }
        .mine .bubble { background-color: #fee500; color: #000; border-top-right-radius: 2px; }
        .other .bubble { background-color: #fff; color: #000; border-top-left-radius: 2px; }
        
        .time { font-size: 9px; color: #777; margin-top: 2px; align-self: flex-end; }

        /* 답장 인용 스타일 */
        .reply-quote { background: rgba(0,0,0,0.06); padding: 4px 8px; border-radius: 4px; font-size: 11px; color: #444; margin-bottom: 4px; border-left: 3px solid #3c1e1e; }
        .chat-image { max-width: 200px; max-height: 200px; border-radius: 8px; margin-top: 4px; display: block; }

        /* 하단 입력 영역 영역 */
        .chat-input-area { padding: 10px; background-color: #f0f0f0; display: flex; flex-direction: column; gap: 6px; }
        .input-row { display: flex; gap: 8px; align-items: center; width: 100%; }
        .btn-attach { background: #ddd; border: none; width: 36px; height: 36px; border-radius: 4px; font-weight: bold; font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center; color: #555; }
        .btn-attach:hover { background: #ccc; }
        .chat-input-area textarea { flex: 1; padding: 10px; border: none; border-radius: 4px; font-size: 14px; outline: none; resize: none; height: 38px; line-height: 18px; }
        .chat-input-area button.send-btn { padding: 10px 16px; background-color: #fee500; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; height: 38px; }

        /* 답장 미리보기 바 */
        #reply-preview-bar { display: none; justify-content: space-between; align-items: center; background: #e4dfd5; padding: 4px 8px; border-radius: 4px; font-size: 12px; color: #333; }
        #reply-preview-bar button { background: none; border: none; font-weight: bold; cursor: pointer; color: #777; }

        /* 입력 중 알림 바 */
        #typing-notice { font-size: 11px; color: #666; padding: 0 4px; min-height: 16px; }

        /* 스크롤 위에 떠있는 새 메시지 알림 배너 스타일 */
        #new-message-banner {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(31, 31, 31, 0.9);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 5;
            white-space: nowrap;
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
            align-items: center;
            gap: 6px;
        }

        /* 접속자 목록 모달 창 */
        #user-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 10; }
        .modal-content { background: #fff; width: 80%; max-width: 280px; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .modal-content h3 { font-size: 16px; color: #333; border-bottom: 1px solid #ddd; padding-bottom: 8px; }
        #online-users-list { list-style: none; max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #444; }
        #online-users-list li { padding: 6px 8px; background: #f9f9f9; border-radius: 4px; display: flex; align-items: center; gap: 6px; }
        #online-users-list li::before { content: "●"; color: #2ecc71; font-size: 10px; }
        .modal-close-btn { align-self: flex-end; padding: 6px 12px; background: #ddd; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }

        /* 컨텍스트 메뉴 스타일 */
        #chat-menu-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); justify-content: center; align-items: center; z-index: 20; }
        .chat-menu-content { background: #fff; width: 180px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: flex; flex-direction: column; }
        .chat-menu-item { padding: 12px; text-align: center; border-bottom: 1px solid #eee; background: none; border: none; font-size: 14px; cursor: pointer; font-weight: bold; color: #333; }
        .chat-menu-item:last-child { border-bottom: none; }
        .chat-menu-item:hover { background: #f5f5f5; }
        .chat-menu-item.delete { color: #d9534f; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 로그인/회원가입 영역 -->
        <div id="auth-screen">
            <h2>1-1 채팅</h2>
            <div class="input-group">
                <input type="text" id="username" placeholder="닉네임">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="비밀번호">
            </div>
            <div class="btn-group">
                <button class="btn-login" onclick="login()">로그인</button>
                <button class="btn-signup" onclick="signup()">회원가입</button>
            </div>
            <div id="auth-error" class="error-msg"></div>
        </div>

        <!-- 채팅방 영역 -->
        <div id="chat-screen">
            <div class="chat-header">
                <span id="room-title">1-1 채팅</span>
                <button id="user-list-btn" onclick="toggleUserModal()">온라인유저 확인</button>
            </div>
            
            <div class="chat-messages" id="chat-messages" onscroll="handleScroll()">
                <!-- 스크롤 위에 떠있는 새 메시지 알림 배너 -->
                <div id="new-message-banner" onclick="scrollToBottom()">
                    <span id="banner-text">새 메시지가 도착했습니다.</span> ▾
                </div>
            </div>

            <!-- 하단 입력 영역 -->
            <div class="chat-input-area">
                <div id="reply-preview-bar">
                    <span id="reply-preview-text"></span>
                    <button onclick="cancelReply()">✕</button>
                </div>
                <div id="typing-notice"></div>
                <div class="input-row">
                    <button class="btn-attach" onclick="document.getElementById('image-input').click()">+</button>
                    <input type="file" id="image-input" accept="image/*" style="display: none;" onchange="sendImage(this)">
                    
                    <textarea id="message-input" placeholder="메시지를 입력하세요..." oninput="handleTyping()" onkeydown="handleKeyDown(event)"></textarea>
                    <button class="send-btn" onclick="sendMessage()">전송</button>
                </div>
            </div>

            <!-- 접속자 목록 모달 -->
            <div id="user-modal" onclick="if(event.target === this) toggleUserModal()">
                <div class="modal-content">
                    <h3>접속 중인 유저</h3>
                    <ul id="online-users-list"></ul>
                    <button class="modal-close-btn" onclick="toggleUserModal()">닫기</button>
                </div>
            </div>

            <!-- 답장/삭제 선택 커스텀 메뉴 모달 -->
            <div id="chat-menu-modal" onclick="if(event.target === this) closeChatMenu()">
                <div class="chat-menu-content" id="chat-menu-box">
                    <button class="chat-menu-item" onclick="actionReply()">답장하기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let socket;
        let myUsername = '';
        let currentReply = null; 
        let typingTimer;
        let selectedMessageData = null; 

        async function signup() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if(!username || !password) {
                document.getElementById('auth-error').innerText = '닉네임과 비밀번호를 입력해주세요.';
                return;
            }

            const res = await fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            document.getElementById('auth-error').innerText = data.message;
        }

        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if(!username || !password) {
                document.getElementById('auth-error').innerText = '닉네임과 비밀번호를 입력해주세요.';
                return;
            }

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            
            if (data.success) {
                myUsername = username;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'flex';
                initSocket();
            } else {
                document.getElementById('auth-error').innerText = data.message;
            }
        }

        function initSocket() {
            socket = io({
                query: { username: myUsername }
            });

            socket.on('load_history', (history) => {
                const chatMessages = document.getElementById('chat-messages');
                const banner = document.getElementById('new-message-banner');
                chatMessages.innerHTML = '';
                chatMessages.appendChild(banner);

                history.forEach(data => appendMessage(data, false));
            });

            socket.on('receive_message', (data) => {
                appendMessage(data, true);
            });

            socket.on('message_deleted', (messageId) => {
                const msgEl = document.getElementById(`msg-${messageId}`);
                if (msgEl) {
                    msgEl.remove();
                }
            });

            socket.on('update_user_list', (users) => {
                const listEl = document.getElementById('online-users-list');
                listEl.innerHTML = '';
                users.forEach(user => {
                    const li = document.createElement('li');
                    li.innerText = user;
                    listEl.appendChild(li);
                });
            });

            socket.on('update_typing', (users) => {
                const otherTyping = users.filter(u => u !== myUsername);
                const noticeEl = document.getElementById('typing-notice');
                if (otherTyping.length === 0) {
                    noticeEl.innerText = '';
                } else if (otherTyping.length === 1) {
                    noticeEl.innerText = `${otherTyping[0]}님이 입력 중입니다...`;
                } else {
                    noticeEl.innerText = `${otherTyping[0]}님 외 ${otherTyping.length - 1}명이 입력 중입니다...`;
                }
            });
        }

        function toggleUserModal() {
            const modal = document.getElementById('user-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function handleTyping() {
            socket.emit('typing', true);
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => {
                socket.emit('typing', false);
            }, 1500);
        }

        function handleKeyDown(event) {
            if (event.isComposing || event.keyCode === 229) {
                return;
            }

            if (event.key === 'Enter') {
                if (event.shiftKey) {
                    return;
                } else {
                    event.preventDefault();
                    sendMessage();
                }
            }
        }

        function scrollToBottom() {
            const chatMessages = document.getElementById('chat-messages');
            chatMessages.scrollTop = chatMessages.scrollHeight;
            document.getElementById('new-message-banner').style.display = 'none';
        }

        function handleScroll() {
            const chatMessages = document.getElementById('chat-messages');
            // 바닥에서 30px 이상 위로 올라가 있으면 스크롤한 상태로 판정
            const distanceToBottom = chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight;
            
            if (distanceToBottom <= 30) {
                document.getElementById('new-message-banner').style.display = 'none';
            }
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            if (!message && !currentReply) return;

            const now = new Date();
            const timeString = now.toLocaleTimeString('ko-KR', {
                timeZone: 'Asia/Seoul',
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });

            socket.emit('send_message', {
                username: myUsername,
                message: message,
                time: timeString,
                replyTo: currentReply
            });

            input.value = '';
            socket.emit('typing', false);
            cancelReply();
        }

        function sendImage(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    const now = new Date();
                    const timeString = now.toLocaleTimeString('ko-KR', {
                        timeZone: 'Asia/Seoul',
                        hour: '2-digit',
                        minute: '2-digit',
                        hour12: true
                    });

                    socket.emit('send_message', {
                        username: myUsername,
                        message: '',
                        image: e.target.result,
                        time: timeString,
                        replyTo: currentReply
                    });
                    cancelReply();
                    input.value = ''; 
                };
                reader.readAsDataURL(file);
            }
        }

        function setReply(username, text) {
            currentReply = { username, text: text || '[이미지]' };
            document.getElementById('reply-preview-text').innerText = `${username}: ${currentReply.text}`;
            document.getElementById('reply-preview-bar').style.display = 'flex';
            document.getElementById('message-input').focus();
        }

        function cancelReply() {
            currentReply = null;
            document.getElementById('reply-preview-bar').style.display = 'none';
        }

        function openChatMenu(data) {
            selectedMessageData = data;
            const menuModal = document.getElementById('chat-menu-modal');
            const menuBox = document.getElementById('chat-menu-box');
            
            menuBox.innerHTML = `
                <button class="chat-menu-item" onclick="actionReply()">답장하기</button>
            `;

            if (data.username === myUsername && data._id) {
                menuBox.innerHTML += `
                    <button class="chat-menu-item delete" onclick="actionDelete()">삭제하기</button>
                `;
            }

            menuModal.style.display = 'flex';
        }

        function closeChatMenu() {
            document.getElementById('chat-menu-modal').style.display = 'none';
        }

        function actionReply() {
            closeChatMenu();
            if (selectedMessageData) {
                setReply(selectedMessageData.username, selectedMessageData.message);
            }
        }

        function actionDelete() {
            closeChatMenu();
            if (selectedMessageData && selectedMessageData._id) {
                socket.emit('delete_message', selectedMessageData._id);
            }
        }

        function appendMessage(data, isNewMessage) {
            const chatMessages = document.getElementById('chat-messages');
            
            // 현재 스크롤이 바닥에서 30px 이상 떨어져 있는지 확인
            const distanceToBottom = chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight;
            const isScrolledUp = distanceToBottom > 30;
            const isMine = data.username === myUsername;

            const box = document.createElement('div');
            box.className = `message-box ${isMine ? 'mine' : 'other'}`;
            if (data._id) {
                box.id = `msg-${data._id}`;
            }

            box.oncontextmenu = (e) => {
                e.preventDefault();
                openChatMenu(data);
            };

            if (!isMine) {
                const nameDiv = document.createElement('div');
                nameDiv.className = 'sender-name';
                nameDiv.innerText = data.username;
                box.appendChild(nameDiv);
            }

            if (data.replyTo) {
                const quoteDiv = document.createElement('div');
                quoteDiv.className = 'reply-quote';
                quoteDiv.innerText = `↳ ${data.replyTo.username}: ${data.replyTo.text}`;
                box.appendChild(quoteDiv);
            }

            if (data.message) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.innerText = data.message;
                box.appendChild(bubble);
            }

            if (data.image) {
                const img = document.createElement('img');
                img.src = data.image;
                img.className = 'chat-image';
                box.appendChild(img);
            }

            const time = document.createElement('span');
            time.className = 'time';
            time.innerText = data.time || new Date().toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: true });
            box.appendChild(time);

            chatMessages.appendChild(box);

            // 스크롤 및 배너 처리
            if (!isNewMessage || !isScrolledUp) {
                chatMessages.scrollTop = chatMessages.scrollHeight;
                document.getElementById('new-message-banner').style.display = 'none';
            } else {
                const bannerText = document.getElementById('banner-text');
                const contentSummary = data.message ? data.message : '[사진]';
                bannerText.innerText = `${data.username}: ${contentSummary}`;
                document.getElementById('new-message-banner').style.display = 'flex';
            }
        }
    </script>
</body>
</html>
